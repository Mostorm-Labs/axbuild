[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "axbuild"
version = "0.1.0"
description = "Reusable dependency resolution and build-environment infrastructure for Mostorm-Labs projects"
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "Mostorm Labs"}]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
axbuild = "axbuild.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
addopts = "-ra"
